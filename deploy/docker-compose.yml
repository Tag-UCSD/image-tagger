version: '3.8'

# All configuration is sourced from the repo-root `.env` file (see
# `.env.example`). Docker Compose auto-loads `../.env` relative to this
# file, and each service explicitly re-declares the variables it needs so
# compose fails with a clear message if a required one is missing.

services:
  # 1. The Source of Truth (Database)
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tagger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Business Logic (Backend API)
  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    restart: always
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      VLM_HARD_LIMIT_USD: ${VLM_HARD_LIMIT_USD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IMAGE_STORAGE_ROOT: /app/data_store
      API_SECRET: ${API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tagger-net
    volumes:
      # Mount the old v2 logic folder so we don't have to copy it into the docker image manually
      - ../backend/image_tagger:/app/backend/image_tagger
      - image_data:/app/data_store

  # 3. The User Interface (Frontend Gateway)
  frontend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.frontend
    restart: always
    ports:
      - "8080:80" # The Single Entry Point for all users
    depends_on:
      - api
    networks:
      - tagger-net

volumes:
  postgres_data:
  image_data:

networks:
  tagger-net:
    driver: bridge
