name: Image Tagger v3 CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              fastapi uvicorn sqlalchemy pydantic psycopg2-binary pytest requests \
              pydantic-settings structlog "python-jose[cryptography]" \
              httpx PyYAML \
              numpy opencv-python-headless
          fi

      - name: Run Guardian verification
        run: |
          python scripts/guardian.py verify

      - name: Import backend entrypoint
        run: |
          PYTHONPATH=. python -c "import backend.main; print('backend.main import OK')"

      - name: Run Guardian tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_guardian.py

      - name: Verify no Python cache artifacts are checked in
        run: |
          python scripts/check_no_pycache_in_tree.py
