name: Image Tagger Repo Hygiene

on:
  push:
  pull_request:

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repo hygiene checks
        run: |
          python scripts/repo_hygiene.py
