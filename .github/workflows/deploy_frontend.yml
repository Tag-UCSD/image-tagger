name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Diagnose build env (lengths only; values are masked)
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DEMO_ADMIN_JWT: ${{ secrets.VITE_DEMO_ADMIN_JWT }}
          VITE_DEMO_TAGGER_JWT: ${{ secrets.VITE_DEMO_TAGGER_JWT }}
          VITE_DEMO_SUPERVISOR_JWT: ${{ secrets.VITE_DEMO_SUPERVISOR_JWT }}
        run: |
          echo "VITE_USE_MOCKS          len=${#VITE_USE_MOCKS}"
          echo "VITE_API_BASE_URL       len=${#VITE_API_BASE_URL}"
          echo "VITE_DEMO_ADMIN_JWT     len=${#VITE_DEMO_ADMIN_JWT}"
          echo "VITE_DEMO_TAGGER_JWT    len=${#VITE_DEMO_TAGGER_JWT}"
          echo "VITE_DEMO_SUPERVISOR_JWT len=${#VITE_DEMO_SUPERVISOR_JWT}"

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DEMO_ADMIN_JWT: ${{ secrets.VITE_DEMO_ADMIN_JWT }}
          VITE_DEMO_TAGGER_JWT: ${{ secrets.VITE_DEMO_TAGGER_JWT }}
          VITE_DEMO_SUPERVISOR_JWT: ${{ secrets.VITE_DEMO_SUPERVISOR_JWT }}

      - name: Diagnose built bundle (was env baked in?)
        run: |
          BUNDLE=$(ls frontend/dist/explorer/assets/index-*.js | head -1)
          echo "Bundle: $BUNDLE  size=$(wc -c < "$BUNDLE")"
          echo "onrender.com occurrences:  $(grep -c 'onrender\.com' "$BUNDLE" || true)"
          echo "eyJhbGc JWT-shaped strings: $(grep -oE 'eyJhbGc[A-Za-z0-9._-]{30,}' "$BUNDLE" | wc -l)"
          echo "Empty-VITE-replacement marker (api base resolved to ''): $(grep -oE '\"\"\.replace\(/\\/\\\$/' "$BUNDLE" | wc -l)"

      - name: Prepare Vercel output at repo root
        run: |
          mkdir -p .vercel/output/static
          cp -r frontend/dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/v1/(.*)$", "dest": "https://image-tagger-backend.onrender.com/v1/$1" },
              { "src": "^/health$", "dest": "https://image-tagger-backend.onrender.com/health" },
              { "src": "^/static/(.*)$", "dest": "https://image-tagger-backend.onrender.com/static/$1" },
              { "src": "^/workbench(/.*)?$", "dest": "/workbench/index.html" },
              { "src": "^/monitor(/.*)?$",   "dest": "/monitor/index.html" },
              { "src": "^/admin(/.*)?$",     "dest": "/admin/index.html" },
              { "src": "^/(.*)$",            "dest": "/explorer/index.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
