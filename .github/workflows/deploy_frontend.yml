name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_USE_MOCKS: "false"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DEMO_ADMIN_JWT: ${{ secrets.VITE_DEMO_ADMIN_JWT }}
          VITE_DEMO_TAGGER_JWT: ${{ secrets.VITE_DEMO_TAGGER_JWT }}
          VITE_DEMO_SUPERVISOR_JWT: ${{ secrets.VITE_DEMO_SUPERVISOR_JWT }}

      - name: Prepare Vercel output
        working-directory: frontend
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/workbench(/.*)?$", "dest": "/workbench/index.html" },
              { "src": "^/monitor(/.*)?$",   "dest": "/monitor/index.html" },
              { "src": "^/admin(/.*)?$",     "dest": "/admin/index.html" },
              { "src": "^/(.*)$",            "dest": "/explorer/index.html" }
            ]
          }
          EOF

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
